# This is a basic workflow to help you get started with Actions

name: Node.js CD

# Controls when the action will run. 
on:
  # Triggers the workflow on push request events but only for the main branch
  push:
    branches: [ ci/cd ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: Deploy using ssh
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.PRIVATE_KEY }}
        port: 22
        script: |
          cd /home/ubuntu/QuickBlox-BackEndApp && pm2 stop bot_admin_application.js
          rm -rf /home/ubuntu/QuickBlox-BackEndApp
	        cd /home/ubuntu/
          git clone git@github.com:shreshkhatri/QuickBlox-BackEndApp.git
          cd /home/ubuntu/QuickBlox-BackEndApp
          git status
          npm install
          cp -p /home/ubuntu/backend_env /home/ubuntu/QuickBlox-BackEndApp/.env
          pm2 start bot_admin_application.js --log app.log --merge-logs
